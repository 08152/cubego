<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>cubego – kleine KI im Browser</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      padding: 20px;
    }
    h1 {
      margin-top: 0;
    }
    #status {
      margin-bottom: 10px;
      font-size: 0.9rem;
      color: #9fd3ff;
    }
    #output {
      white-space: pre-wrap;
      border: 1px solid #444;
      padding: 10px;
      min-height: 80px;
      margin-top: 10px;
      background: #181818;
    }
    textarea {
      width: 100%;
      height: 80px;
      background: #181818;
      color: #eee;
      border: 1px solid #444;
      padding: 8px;
      resize: vertical;
    }
    button {
      margin-top: 10px;
      padding: 8px 14px;
      border: none;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      border-radius: 4px;
    }
    button:disabled {
      background: #555;
      cursor: default;
    }
  </style>
</head>
<body>
  <h1>cubego</h1>
  <div id="status">Starte KI…</div>

  <textarea id="input" placeholder="Schreib hier deinen Prompt rein…"></textarea>
  <button id="trainBtn">Trainieren</button>
  <button id="generateBtn" disabled>Generieren</button>

  <div id="output"></div>

  <script>
    const statusEl = document.getElementById("status");
    const outputEl = document.getElementById("output");
    const inputEl = document.getElementById("input");
    const trainBtn = document.getElementById("trainBtn");
    const generateBtn = document.getElementById("generateBtn");

    // WICHTIG: Pfade relativ zum Repo /cubego
    const trainWorker = new Worker("./train-worker.js");
    const generateWorker = new Worker("./generate-worker.js");

    let modelReady = false;

    // Fehler im Worker sichtbar machen
    trainWorker.onerror = (e) => {
      console.error("Train-Worker error:", e);
      statusEl.textContent = "Fehler im Train-Worker (siehe Konsole)";
    };

    generateWorker.onerror = (e) => {
      console.error("Generate-Worker error:", e);
      statusEl.textContent = "Fehler im Generate-Worker (siehe Konsole)";
    };

    // Nachrichten vom Train-Worker
    trainWorker.onmessage = (event) => {
      const data = event.data;

      if (data.status === "loading") {
        statusEl.textContent = "Lade Modelldaten…";
      } else if (data.status === "training") {
        statusEl.textContent = "Trainiere Modell…";
      } else if (data.status === "ready") {
        statusEl.textContent = "Modell bereit. Du kannst jetzt generieren.";
        modelReady = true;
        generateBtn.disabled = false;
      } else if (data.status === "log") {
        console.log("[TRAIN]", data.message);
      } else if (data.status === "error") {
        statusEl.textContent = "Train-Fehler: " + data.message;
        console.error("Train-Fehler:", data.message);
      }
    };

    // Nachrichten vom Generate-Worker
    generateWorker.onmessage = (event) => {
      const data = event.data;

      if (data.status === "generating") {
        statusEl.textContent = "Generiere Text…";
      } else if (data.status === "done") {
        statusEl.textContent = "Fertig.";
        outputEl.textContent = data.output || "";
      } else if (data.status === "error") {
        statusEl.textContent = "Generate-Fehler: " + data.message;
        console.error("Generate-Fehler:", data.message);
      }
    };

    // Start: Modell laden / trainieren
    statusEl.textContent = "Lade Modelldaten…";
    trainWorker.postMessage({ action: "init" });

    trainBtn.addEventListener("click", () => {
      statusEl.textContent = "Trainiere Modell…";
      trainWorker.postMessage({ action: "train" });
    });

    generateBtn.addEventListener("click", () => {
      if (!modelReady) {
        statusEl.textContent = "Modell noch nicht bereit.";
        return;
      }
      const prompt = inputEl.value.trim();
      if (!prompt) {
        statusEl.textContent = "Bitte einen Prompt eingeben.";
        return;
      }
      statusEl.textContent = "Generiere Text…";
      generateWorker.postMessage({ action: "generate", prompt });
    });
  </script>
</body>
</html>
