<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUMORA</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#080611;
    color:#fff;
}

body{
    display:flex;
    overflow:hidden;
}

#app{
    width:100%;
    height:100%;
    display:flex;
}

.sidebar{
    width:280px;
    background:#0d0a18;
    border-right:1px solid #28203d;
    display:flex;
    flex-direction:column;
    padding:18px;
    gap:14px;
}

.logo{
    font-size:28px;
    font-weight:800;
    letter-spacing:2px;
    padding:8px 4px 18px;
}

.logo span{
    color:#9d6cff;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 15px;
    color:white;
    background:#21183a;
    cursor:pointer;
    font-size:14px;
    transition:.15s;
}

button:hover{
    background:#302052;
    transform:translateY(-1px);
}

.train{
    background:linear-gradient(135deg,#7c3cff,#4c7dff);
    font-weight:700;
    font-size:15px;
}

.train:hover{
    background:linear-gradient(135deg,#9158ff,#638fff);
}

.train:disabled{
    opacity:.55;
    cursor:not-allowed;
    transform:none;
}

.status{
    margin-top:auto;
    border:1px solid #28203d;
    background:#110d1e;
    border-radius:14px;
    padding:14px;
    font-size:13px;
}

.statusTitle{
    color:#aaa0c4;
    margin-bottom:7px;
}

.dot{
    display:inline-block;
    width:9px;
    height:9px;
    border-radius:50%;
    background:#777;
    margin-right:7px;
}

.dot.ok{
    background:#43e68b;
    box-shadow:0 0 10px #43e68b;
}

.dot.busy{
    background:#ffbd45;
    box-shadow:0 0 10px #ffbd45;
}

.dot.error{
    background:#ff4d6d;
    box-shadow:0 0 10px #ff4d6d;
}

.main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

.header{
    height:68px;
    border-bottom:1px solid #28203d;
    display:flex;
    align-items:center;
    padding:0 24px;
    background:#0a0712;
}

.headerTitle{
    font-size:19px;
    font-weight:700;
}

.headerInfo{
    margin-left:auto;
    color:#8f86a5;
    font-size:13px;
}

#messages{
    flex:1;
    overflow-y:auto;
    padding:30px 8%;
}

.message{
    max-width:900px;
    margin:0 auto 22px;
    display:flex;
    gap:14px;
}

.avatar{
    width:38px;
    height:38px;
    min-width:38px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#201635;
    font-weight:bold;
}

.user .avatar{
    background:#302052;
}

.content{
    flex:1;
    line-height:1.65;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.user .content{
    background:#171122;
    border:1px solid #28203d;
    padding:13px 16px;
    border-radius:15px;
}

.assistant .content{
    padding-top:5px;
}

.welcome{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.welcomeBox{
    max-width:650px;
}

.welcomeBox h1{
    font-size:50px;
    margin:0 0 10px;
    background:linear-gradient(90deg,#fff,#a77cff);
    -webkit-background-clip:text;
    color:transparent;
}

.welcomeBox p{
    color:#8f86a5;
    font-size:16px;
}

.composer{
    padding:16px 8% 22px;
    border-top:1px solid #28203d;
    background:#0a0712;
}

.inputBox{
    max-width:900px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:10px;
    background:#151020;
    border:1px solid #302644;
    border-radius:18px;
    padding:10px;
}

textarea{
    flex:1;
    min-height:46px;
    max-height:180px;
    resize:none;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    font:inherit;
    padding:10px;
}

textarea::placeholder{
    color:#716981;
}

.send{
    width:46px;
    height:46px;
    padding:0;
    border-radius:13px;
    background:#7c3cff;
    font-size:19px;
}

.send:hover{
    background:#925cff;
}

.small{
    text-align:center;
    color:#5f5870;
    font-size:11px;
    margin-top:9px;
}

.progressBox{
    display:none;
    margin-top:12px;
    max-width:900px;
    margin-left:auto;
    margin-right:auto;
}

.progressBox.show{
    display:block;
}

.progressBar{
    height:8px;
    border-radius:99px;
    background:#201a2d;
    overflow:hidden;
}

.progressFill{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#7c3cff,#55a8ff);
    transition:width .3s;
}

.progressText{
    margin-top:7px;
    font-size:12px;
    color:#8f86a5;
}

@media(max-width:750px){
    .sidebar{
        width:220px;
    }

    #messages{
        padding:20px 4%;
    }

    .composer{
        padding:12px 4% 16px;
    }

    .welcomeBox h1{
        font-size:38px;
    }

    .headerInfo{
        display:none;
    }
}

@media(max-width:560px){
    .sidebar{
        position:absolute;
        left:0;
        top:0;
        bottom:0;
        z-index:10;
        transform:translateX(-100%);
        transition:.2s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .header{
        padding-left:16px;
    }
}
</style>
</head>

<body>

<div id="app">

    <aside class="sidebar">

        <div class="logo">
            LU<span>MORA</span>
        </div>

        <button class="train" id="trainButton">
            🧠 Training starten
        </button>

        <button id="statusButton">
            📊 Status prüfen
        </button>

        <button id="clearButton">
            🗑️ Chat löschen
        </button>

        <div class="status">
            <div class="statusTitle">System</div>

            <div>
                <span class="dot" id="systemDot"></span>
                <span id="systemStatus">Verbinde...</span>
            </div>

            <div style="margin-top:8px;color:#6f687e">
                Modell:
                <span id="modelStatus">unbekannt</span>
            </div>

            <div style="margin-top:4px;color:#6f687e">
                Tokenizer:
                <span id="tokenizerStatus">unbekannt</span>
            </div>
        </div>

    </aside>

    <main class="main">

        <header class="header">
            <div class="headerTitle">
                LUMORA
            </div>

            <div class="headerInfo">
                Eigenes Sprachmodell
            </div>
        </header>

        <section id="messages">

            <div class="welcome" id="welcome">

                <div class="welcomeBox">
                    <h1>LUMORA</h1>

                    <p>
                        Dein eigenes trainierbares Sprachmodell.
                        Starte zuerst das Training mit deinen
                        Daten aus <b>DATEN/training.json</b>.
                    </p>
                </div>

            </div>

        </section>

        <div class="composer">

            <div class="progressBox" id="progressBox">

                <div class="progressBar">
                    <div
                        class="progressFill"
                        id="progressFill">
                    </div>
                </div>

                <div
                    class="progressText"
                    id="progressText">
                    Training wird vorbereitet...
                </div>

            </div>

            <div class="inputBox">

                <textarea
                    id="prompt"
                    placeholder="Schreibe eine Nachricht..."
                    rows="1"></textarea>

                <button
                    class="send"
                    id="sendButton">
                    ➤
                </button>

            </div>

            <div class="small">
                LUMORA · eigenes Modell · keine externe KI-API
            </div>

        </div>

    </main>

</div>

<script>
const API = "";

let messages = [];
let generating = false;
let training = false;

const messagesElement =
    document.getElementById("messages");

const welcome =
    document.getElementById("welcome");

const promptInput =
    document.getElementById("prompt");

const sendButton =
    document.getElementById("sendButton");

const trainButton =
    document.getElementById("trainButton");

const statusButton =
    document.getElementById("statusButton");

const clearButton =
    document.getElementById("clearButton");

const systemDot =
    document.getElementById("systemDot");

const systemStatus =
    document.getElementById("systemStatus");

const modelStatus =
    document.getElementById("modelStatus");

const tokenizerStatus =
    document.getElementById("tokenizerStatus");

const progressBox =
    document.getElementById("progressBox");

const progressFill =
    document.getElementById("progressFill");

const progressText =
    document.getElementById("progressText");


function addMessage(role, text){

    if(welcome){
        welcome.style.display = "none";
    }

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " + role;

    const avatar =
        document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
        role === "user"
            ? "DU"
            : "L";

    const content =
        document.createElement("div");

    content.className = "content";

    content.textContent = text;

    wrapper.appendChild(avatar);
    wrapper.appendChild(content);

    messagesElement.appendChild(wrapper);

    messagesElement.scrollTop =
        messagesElement.scrollHeight;

    return content;
}


function setSystemState(state, text){

    systemStatus.textContent = text;

    systemDot.className =
        "dot " + state;
}


async function checkStatus(){

    try{

        const response =
            await fetch(
                API + "/api/status",
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data =
            await response.json();

        const model =
            data.model === true ||
            data.modelExists === true;

        const tokenizer =
            data.tokenizer === true ||
            data.tokenizerExists === true;

        modelStatus.textContent =
            model ? "vorhanden" : "nicht vorhanden";

        tokenizerStatus.textContent =
            tokenizer
                ? "vorhanden"
                : "nicht vorhanden";

        if(model && tokenizer){

            setSystemState(
                "ok",
                "Bereit"
            );

        }else{

            setSystemState(
                "",
                "Training erforderlich"
            );
        }

        return data;

    }catch(error){

        setSystemState(
            "error",
            "Server nicht erreichbar"
        );

        console.error(error);
    }
}


async function startTraining(){

    if(training){
        return;
    }

    training = true;

    trainButton.disabled = true;

    progressBox.classList.add("show");

    progressFill.style.width = "2%";

    progressText.textContent =
        "Training wird gestartet...";

    setSystemState(
        "busy",
        "Training läuft"
    );

    try{

        const response =
            await fetch(
                API + "/api/train/start",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        epochs:10,
                        sequenceLength:256,
                        learningRate:0.0003
                    })
                }
            );

        const data =
            await response.json()
            .catch(() => ({}));

        if(!response.ok){

            throw new Error(
                data.error ||
                "HTTP " + response.status
            );
        }

        progressText.textContent =
            "Training gestartet...";

        monitorTraining();

    }catch(error){

        console.error(error);

        progressText.textContent =
            "Fehler: " + error.message;

        setSystemState(
            "error",
            "Training fehlgeschlagen"
        );

        training = false;

        trainButton.disabled = false;
    }
}


async function monitorTraining(){

    const started =
        Date.now();

    const timeout =
        1000 * 60 * 60;

    async function loop(){

        if(
            Date.now() - started >
            timeout
        ){

            progressText.textContent =
                "Training-Zeitüberschreitung.";

            training = false;
            trainButton.disabled = false;

            setSystemState(
                "error",
                "Training gestoppt"
            );

            return;
        }

        try{

            const response =
                await fetch(
                    API +
                    "/api/training-state",
                    {
                        cache:"no-store"
                    }
                );

            if(response.ok){

                const data =
                    await response.json();

                updateTrainingUI(data);
            }

        }catch(error){

            console.error(
                "Training-Status:",
                error
            );
        }

        try{

            const status =
                await fetch(
                    API +
                    "/api/status",
                    {
                        cache:"no-store"
                    }
                );

            if(status.ok){

                const data =
                    await status.json();

                const model =
                    data.model === true ||
                    data.modelExists === true;

                const tokenizer =
                    data.tokenizer === true ||
                    data.tokenizerExists === true;

                modelStatus.textContent =
                    model
                        ? "vorhanden"
                        : "nicht vorhanden";

                tokenizerStatus.textContent =
                    tokenizer
                        ? "vorhanden"
                        : "nicht vorhanden";

                if(model && tokenizer){

                    progressFill.style.width =
                        "100%";

                    progressText.textContent =
                        "✅ Training abgeschlossen.";

                    setSystemState(
                        "ok",
                        "Bereit"
                    );

                    training = false;

                    trainButton.disabled =
                        false;

                    return;
                }
            }

        }catch(error){

            console.error(error);
        }

        setTimeout(
            loop,
            2000
        );
    }

    loop();
}


function updateTrainingUI(data){

    if(!data){
        return;
    }

    const epoch =
        Number(
            data.epoch ||
            data.currentEpoch ||
            0
        );

    const totalEpochs =
        Number(
            data.totalEpochs ||
            data.epochs ||
            10
        );

    let percent =
        totalEpochs > 0
            ? (epoch / totalEpochs) * 100
            : 0;

    if(
        data.progress !== undefined
    ){

        const p =
            Number(data.progress);

        if(Number.isFinite(p)){
            percent =
                p <= 1
                    ? p * 100
                    : p;
        }
    }

    percent =
        Math.max(
            2,
            Math.min(
                99,
                percent
            )
        );

    progressFill.style.width =
        percent + "%";

    let text =
        data.message ||
        data.phase ||
        "Training läuft...";

    if(epoch){

        text +=
            " · Epoche " +
            epoch +
            "/" +
            totalEpochs;
    }

    if(
        data.loss !== undefined &&
        data.loss !== null
    ){

        text +=
            " · Loss: " +
            Number(data.loss).toFixed(4);
    }

    progressText.textContent =
        text;
}


async function sendMessage(){

    if(generating){
        return;
    }

    const prompt =
        promptInput.value.trim();

    if(!prompt){
        return;
    }

    addMessage(
        "user",
        prompt
    );

    messages.push({
        role:"user",
        content:prompt
    });

    promptInput.value = "";

    promptInput.style.height =
        "46px";

    generating = true;

    sendButton.disabled =
        true;

    const answerElement =
        addMessage(
            "assistant",
            "..."
        );

    try{

        const response =
            await fetch(
                API + "/api/generate",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        prompt,

                        history:
                            messages.slice(
                                -12,
                                -1
                            ),

                        maxTokens:160,

                        temperature:0.82,

                        topK:40,

                        topP:0.92,

                        repetitionPenalty:1.08
                    })
                }
            );

        const data =
            await response.json()
            .catch(() => ({}));

        if(!response.ok){

            throw new Error(
                data.error ||
                data.message ||
                "HTTP " +
                response.status
            );
        }

        let answer =
            data.answer ||
            data.text ||
            "";

        /*
         * Manche server.js-Versionen
         * starten den Worker und geben
         * nicht sofort die Antwort zurück.
         */
        if(
            !answer &&
            (
                data.started ||
                data.running ||
                data.status === "started"
            )
        ){

            answer =
                await waitForGeneration();
        }

        if(!answer){

            answer =
                "LUMORA hat keine Antwort erzeugt.";
        }

        answerElement.textContent =
            answer;

        messages.push({
            role:"assistant",
            content:answer
        });

    }catch(error){

        console.error(error);

        answerElement.textContent =
            "❌ Fehler: " +
            error.message;
    }

    generating = false;

    sendButton.disabled =
        false;

    messagesElement.scrollTop =
        messagesElement.scrollHeight;
}


async function waitForGeneration(){

    for(let i=0;i<300;i++){

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    500
                )
        );

        try{

            const response =
                await fetch(
                    API +
                    "/api/generate/status",
                    {
                        cache:"no-store"
                    }
                );

            if(!response.ok){
                continue;
            }

            const data =
                await response.json();

            if(
                data.answer
            ){
                return data.answer;
            }

            if(
                data.text
            ){
                return data.text;
            }

            if(
                data.error
            ){
                throw new Error(
                    data.error
                );
            }

        }catch(error){

            if(
                error.message &&
                !error.message.includes(
                    "Failed to fetch"
                )
            ){
                throw error;
            }
        }
    }

    throw new Error(
        "Keine Antwort innerhalb des Zeitlimits."
    );
}


clearButton.addEventListener(
    "click",
    () => {

        messages = [];

        messagesElement.innerHTML = "";

        messagesElement.appendChild(
            welcome
        );

        welcome.style.display =
            "flex";
    }
);


statusButton.addEventListener(
    "click",
    checkStatus
);


trainButton.addEventListener(
    "click",
    startTraining
);


sendButton.addEventListener(
    "click",
    sendMessage
);


promptInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();
        }
    }
);


promptInput.addEventListener(
    "input",
    () => {

        promptInput.style.height =
            "46px";

        promptInput.style.height =
            Math.min(
                180,
                promptInput.scrollHeight
            ) + "px";
    }
);


checkStatus();


setInterval(
    () => {

        if(!training){
            checkStatus();
        }

    },
    10000
);
</script>

</body>
</html>
