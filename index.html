<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Meine KI</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    background:#fff;
    color:#1f1f1f;
    font-family:Arial,Helvetica,sans-serif;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

header{
    height:68px;
    display:flex;
    align-items:center;
    padding:0 24px;
    border-bottom:1px solid #eee;
    background:#fff;
}

.logo{
    width:38px;
    height:38px;
    margin-right:12px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            #4285f4,
            #8e7dff 45%,
            #d965ff 70%,
            #ff8b8b
        );

    color:white;
}

.title{
    font-size:20px;
    color:#333;
}

.status{
    margin-left:auto;
    color:#777;
    font-size:13px;
}

/* CHAT */

.chat{
    flex:1;
    overflow-y:auto;
    padding:45px 20px 150px;
}

.chat-inner{
    width:100%;
    max-width:850px;
    margin:auto;
}

/* START */

.empty{
    min-height:65vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

.empty-icon{
    font-size:64px;
    margin-bottom:15px;

    background:
        linear-gradient(
            135deg,
            #4285f4,
            #8e7dff,
            #d65cff,
            #ff7d7d
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.empty h1{
    margin:0;
    font-size:42px;
    font-weight:600;

    background:
        linear-gradient(
            90deg,
            #4285f4,
            #8e7dff,
            #d65cff
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.empty p{
    color:#777;
    font-size:17px;
}

/* NACHRICHTEN */

.message{
    display:flex;
    margin:25px 0;
}

.message.user{
    justify-content:flex-end;
}

.bubble{
    max-width:75%;
    padding:15px 19px;
    border-radius:22px;
    line-height:1.55;
    white-space:pre-wrap;
    word-break:break-word;
    font-size:16px;
}

.user .bubble{
    background:#f0f1f3;
    color:#202124;
    border-bottom-right-radius:6px;
}

.ai .bubble{
    background:transparent;
    color:#303030;
    padding-left:5px;
}

/* KI ICON */

.ai{
    align-items:flex-start;
}

.ai::before{
    content:"✦";
    min-width:30px;
    height:30px;
    margin-right:9px;
    margin-top:4px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:18px;

    background:
        linear-gradient(
            135deg,
            #4285f4,
            #9b7cff,
            #e56cff,
            #ff8b8b
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

/* INPUT */

.input-area{
    position:fixed;
    bottom:0;
    left:0;
    right:0;

    padding:18px 20px 22px;

    background:
        linear-gradient(
            transparent,
            rgba(255,255,255,.96) 30%
        );
}

.input-container{
    max-width:850px;
    margin:auto;
}

.input-box{
    display:flex;
    align-items:flex-end;
    gap:10px;

    padding:9px 10px 9px 18px;

    background:#f5f6f7;

    border:1px solid #e1e3e6;

    border-radius:28px;

    box-shadow:
        0 2px 10px rgba(0,0,0,.05);

    transition:.2s;
}

.input-box:focus-within{
    background:#fff;

    border-color:#c8c9cc;

    box-shadow:
        0 3px 16px rgba(0,0,0,.08);
}

textarea{
    flex:1;

    border:0;
    outline:0;

    resize:none;

    background:transparent;

    color:#222;

    font-size:16px;

    line-height:1.4;

    padding:10px 0;

    min-height:42px;
    max-height:140px;

    font-family:Arial,Helvetica,sans-serif;
}

textarea::placeholder{
    color:#777;
}

/* SEND BUTTON */

.send{
    width:45px;
    height:45px;

    flex-shrink:0;

    border:0;

    border-radius:50%;

    background:#1f1f1f;

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:.2s;
}

.send:hover{
    transform:scale(1.05);
}

.send:active{
    transform:scale(.94);
}

.send.disabled{
    background:#ddd;
    color:#999;
}

/* SCROLLBAR */

.chat::-webkit-scrollbar{
    width:8px;
}

.chat::-webkit-scrollbar-thumb{
    background:#ddd;
    border-radius:10px;
}

/* MOBILE */

@media(max-width:600px){

    header{
        padding:0 16px;
    }

    .chat{
        padding:30px 12px 140px;
    }

    .empty h1{
        font-size:34px;
    }

    .bubble{
        max-width:88%;
    }

    .input-area{
        padding:12px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>

    <div class="logo">✦</div>

    <div class="title">
        Meine KI
    </div>

    <div class="status">
        Bereit
    </div>

</header>

<main class="chat" id="chat">

    <div class="chat-inner" id="chatInner">

        <div class="empty" id="empty">

            <div class="empty-icon">✦</div>

            <h1>Hallo!</h1>

            <p>Wie kann ich dir helfen?</p>

        </div>

    </div>

</main>

<div class="input-area">

    <div class="input-container">

        <div class="input-box">

            <textarea
                id="input"
                rows="1"
                placeholder="Frag mich etwas..."
            ></textarea>

            <button
                class="send disabled"
                id="send"
            >↑</button>

        </div>

    </div>

</div>

</div>

<script>

const input = document.getElementById("input");
const send = document.getElementById("send");
const chatInner = document.getElementById("chatInner");
const empty = document.getElementById("empty");

function updateButton(){

    if(input.value.trim()){
        send.classList.remove("disabled");
    }else{
        send.classList.add("disabled");
    }
}

input.addEventListener("input",function(){

    this.style.height="42px";

    this.style.height =
        Math.min(this.scrollHeight,140)+"px";

    updateButton();

});

function addMessage(text,type){

    if(empty){
        empty.remove();
    }

    const message =
        document.createElement("div");

    message.className =
        "message "+type;

    const bubble =
        document.createElement("div");

    bubble.className="bubble";

    bubble.textContent=text;

    message.appendChild(bubble);

    chatInner.appendChild(message);

    document.querySelector(".chat").scrollTop =
        document.querySelector(".chat").scrollHeight;
}

function sendMessage(){

    const text=input.value.trim();

    if(!text)return;

    addMessage(text,"user");

    input.value="";
    input.style.height="42px";

    updateButton();

    /*
        HIER WIRD SPÄTER DEINE EIGENE KI
        ANGESCHLOSSEN.

        Beispiel:

        const antwort =
            await meineKI(text);

        addMessage(antwort,"ai");
    */
}

send.addEventListener("click",sendMessage);

input.addEventListener("keydown",function(e){

    if(
        e.key==="Enter" &&
        !e.shiftKey
    ){

        e.preventDefault();

        sendMessage();

    }

});

updateButton();

</script>

</body>
</html>
