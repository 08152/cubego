<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>AR Cube Hunt</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://unpkg.com/aframe-ar@1.7.0/dist/aframe-ar.js"></script>

<style>
body {margin:0; overflow:hidden; font-family:sans-serif; background:black;}
#damage{position:fixed; top:0; left:0; width:100%; height:100%; background:red; opacity:0; pointer-events:none; transition:opacity 0.2s;}
#radar{position:fixed; bottom:20px; right:20px; width:140px; height:140px; background:rgba(0,0,0,0.6); border-radius:50%; border:2px solid white;}
#info{position:fixed; top:10px; left:10px; color:white; background:rgba(0,0,0,0.5); padding:6px;}
#sceneWrapper{display:none; width:100%; height:100%;}
</style>
</head>
<body>

<div id="damage"></div>
<div id="radar"></div>
<div id="info">Lade Kamera & GPS...</div>

<div id="sceneWrapper">
<a-scene
embedded
vr-mode-ui="enabled:false"
background="color: transparent"
arjs="sourceType: webcam; debugUIEnabled:false; trackingMethod: best; detectionMode: mono_and_matrix;">
  <a-camera gps-camera rotation-reader></a-camera>
</a-scene>
</div>

<script>
const sceneWrapper = document.getElementById("sceneWrapper");
const radar = document.getElementById("radar");
const damage = document.getElementById("damage");
const info = document.getElementById("info");

let cubes = [], playerLat = 0, playerLon = 0;

// Haversine-Distanz für GPS
function haversine(lat1,lon1,lat2,lon2){
  const R = 6371000;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  const c = 2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  return R*c;
}

// Würfel-Hindernisse (optional)
const obstacles = [[0,0,0,0]];
function isNearObstacle(lat, lon){
  for(let obs of obstacles){
    if(lat>=obs[0] && lat<=obs[1] && lon>=obs[2] && lon<=obs[3]) return true;
  }
  return false;
}

// Würfel spawnen
function spawnCube(){
  const distance = 8 + Math.random()*112;
  const angle = Math.random()*Math.PI*2;
  const dLat = (distance*Math.cos(angle))/111111;
  const dLon = (distance*Math.sin(angle))/(111111*Math.cos(playerLat*Math.PI/180));
  const lat = playerLat + dLat;
  const lon = playerLon + dLon;

  const cube = document.createElement("a-box");
  cube.setAttribute("color","white");
  cube.setAttribute("scale","0.7 0.7 0.7");
  cube.setAttribute("gps-entity-place",`latitude:${lat}; longitude:${lon};`);
  sceneWrapper.querySelector("a-scene").appendChild(cube);
  cubes.push({lat, lon, el:cube});
}

function spawnMany(){for(let i=0;i<60;i++) spawnCube();}

// Schaden bei Kontakt
function damagePlayer(){damage.style.opacity=0.6; setTimeout(()=>{damage.style.opacity=0},3000);}

// Würfel bewegen
function moveCubes(){
  cubes.forEach(c=>{
    let dist = haversine(playerLat,playerLon,c.lat,c.lon);
    let speed=0.5;
    let dirLat = playerLat-c.lat;
    let dirLon = playerLon-c.lon;
    if(isNearObstacle(c.lat+dirLat*0.00001*speed, c.lon+dirLon*0.00001*speed)){
      dirLat += (Math.random()-0.5)*0.001;
      dirLon += (Math.random()-0.5)*0.001;
    }
    c.lat += dirLat*0.00001*speed;
    c.lon += dirLon*0.00001*speed;
    c.el.setAttribute("gps-entity-place",`latitude:${c.lat}; longitude:${c.lon};`);
    if(dist<2){damagePlayer(); c.lat+=0.0002; c.lon+=0.0002;}
  });
}

// Radar zeichnen
function drawRadar(){
  radar.innerHTML = "";
  cubes.forEach(c=>{
    let dist = haversine(playerLat,playerLon,c.lat,c.lon);
    if(dist<120){
      const dot = document.createElement("div");
      dot.style.position="absolute";
      dot.style.width="6px";
      dot.style.height="6px";
      dot.style.background="white";
      const angle = Math.atan2(c.lon-playerLon,c.lat-playerLat);
      const r = (dist/120)*60;
      const x = 70 + Math.sin(angle)*r;
      const y = 70 + Math.cos(angle)*r;
      dot.style.left = x + "px";
      dot.style.top = y + "px";
      radar.appendChild(dot);
    }
  });
}

// Laser bei Tap
document.addEventListener("click",()=>{
  const laser = document.createElement("a-cylinder");
  laser.setAttribute("color","red");
  laser.setAttribute("radius","0.02");
  laser.setAttribute("height","6");
  laser.setAttribute("position","0 1 -3");
  laser.setAttribute("rotation","90 0 0");
  sceneWrapper.querySelector("a-scene").appendChild(laser);
  setTimeout(()=>laser.remove(),200);
  cubes.forEach((c,i)=>{if(haversine(playerLat,playerLon,c.lat,c.lon)<20){c.el.remove(); cubes.splice(i,1)}});
});

// Hauptschleife
function loop(){moveCubes(); drawRadar(); requestAnimationFrame(loop);}
loop();

// GPS + Kamera starten
function initAR(){
  if(navigator.geolocation){
    navigator.geolocation.watchPosition(pos=>{
      playerLat = pos.coords.latitude;
      playerLon = pos.coords.longitude;
      info.innerText="GPS aktiv";
      if(cubes.length===0) spawnMany();
      // Szene sichtbar machen, sobald GPS + Kamera läuft
      sceneWrapper.style.display="block";
    }, err=>{info.innerText="GPS nicht verfügbar"}, {enableHighAccuracy:true});
  } else {info.innerText="GPS nicht verfügbar";}
}
initAR();
</script>

</body>
</html>
