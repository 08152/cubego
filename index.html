<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUMORA</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#0b0b0f;
    color:#fff;
}

body{
    display:flex;
}

#app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

/* HEADER */

#header{
    height:64px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    padding:0 22px;
    border-bottom:1px solid #24242c;
    background:#101015;
}

#logo{
    font-size:21px;
    font-weight:800;
    letter-spacing:1px;
}

#status{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:#9999a5;
}

#statusDot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#777;
}

#statusDot.online{
    background:#38d878;
    box-shadow:0 0 10px #38d878;
}

#statusDot.error{
    background:#ff4d5d;
}

/* MAIN */

#main{
    flex:1;
    min-height:0;
    display:flex;
}

/* SIDEBAR */

#sidebar{
    width:260px;
    flex-shrink:0;
    border-right:1px solid #24242c;
    background:#0f0f14;
    display:flex;
    flex-direction:column;
    padding:14px;
}

#newChat{
    border:1px solid #34343e;
    background:#191920;
    color:#fff;
    border-radius:10px;
    padding:12px;
    cursor:pointer;
    font-size:14px;
    text-align:left;
}

#newChat:hover{
    background:#22222b;
}

#sideInfo{
    margin-top:auto;
    border-top:1px solid #24242c;
    padding-top:14px;
    color:#777782;
    font-size:12px;
    line-height:1.6;
}

#modelStatus{
    color:#aaaab5;
}

/* CHAT */

#chatArea{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

#messages{
    flex:1;
    overflow-y:auto;
    padding:28px 18px 120px;
}

.message{
    width:min(900px,100%);
    margin:0 auto 25px;
    display:flex;
    gap:14px;
}

.avatar{
    width:34px;
    height:34px;
    flex-shrink:0;
    border-radius:9px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:13px;
    font-weight:bold;
    background:#24242d;
}

.message.user .avatar{
    background:#343444;
}

.message.assistant .avatar{
    background:#665cff;
}

.content{
    min-width:0;
    flex:1;
    line-height:1.65;
    font-size:15px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.empty{
    width:min(900px,100%);
    margin:10vh auto 0;
    text-align:center;
    color:#8c8c98;
}

.empty h1{
    color:#fff;
    font-size:34px;
    margin-bottom:10px;
}

.empty p{
    margin:0;
}

/* INPUT */

#inputArea{
    position:relative;
    padding:14px 18px 18px;
    background:linear-gradient(
        to top,
        #0b0b0f 70%,
        transparent
    );
}

#composer{
    width:min(900px,100%);
    margin:auto;
    position:relative;
}

#prompt{
    width:100%;
    min-height:58px;
    max-height:180px;
    resize:none;
    border:1px solid #34343e;
    outline:none;
    border-radius:16px;
    background:#17171e;
    color:#fff;
    padding:17px 58px 17px 17px;
    font:15px Arial,sans-serif;
    line-height:1.5;
}

#prompt:focus{
    border-color:#665cff;
    box-shadow:0 0 0 2px rgba(102,92,255,.12);
}

#send{
    position:absolute;
    right:9px;
    bottom:9px;
    width:40px;
    height:40px;
    border:0;
    border-radius:11px;
    background:#665cff;
    color:#fff;
    cursor:pointer;
    font-size:17px;
}

#send:hover{
    background:#776eff;
}

#send:disabled{
    opacity:.45;
    cursor:not-allowed;
}

#hint{
    text-align:center;
    color:#656570;
    font-size:11px;
    margin-top:8px;
}

/* LOADING */

.typing{
    color:#92929d;
}

.dot{
    display:inline-block;
    animation:blink 1.2s infinite;
}

.dot:nth-child(2){
    animation-delay:.15s;
}

.dot:nth-child(3){
    animation-delay:.3s;
}

@keyframes blink{
    0%,80%,100%{
        opacity:.25;
    }
    40%{
        opacity:1;
    }
}

/* MOBILE */

@media(max-width:700px){

    #sidebar{
        display:none;
    }

    #header{
        height:56px;
        padding:0 15px;
    }

    #messages{
        padding:20px 12px 110px;
    }

    .message{
        gap:10px;
    }

    .avatar{
        width:30px;
        height:30px;
        border-radius:8px;
        font-size:11px;
    }

    .content{
        font-size:14px;
    }

    #inputArea{
        padding:10px 10px 13px;
    }

    #prompt{
        border-radius:14px;
    }

    .empty{
        margin-top:18vh;
    }

    .empty h1{
        font-size:29px;
    }
}
</style>
</head>

<body>

<div id="app">

    <header id="header">
        <div id="logo">LUMORA</div>

        <div id="status">
            <span id="statusDot"></span>
            <span id="statusText">Verbinde...</span>
        </div>
    </header>

    <main id="main">

        <aside id="sidebar">

            <button id="newChat">
                ＋ Neuer Chat
            </button>

            <div id="sideInfo">
                <div>Lokale KI</div>
                <div id="modelStatus">Modell wird geprüft...</div>
            </div>

        </aside>

        <section id="chatArea">

            <div id="messages">

                <div class="empty" id="empty">

                    <h1>LUMORA</h1>

                    <p>
                        Was möchtest du wissen?
                    </p>

                </div>

            </div>

            <div id="inputArea">

                <div id="composer">

                    <textarea
                        id="prompt"
                        placeholder="Nachricht an LUMORA..."
                        autocomplete="off"
                        spellcheck="true"
                    ></textarea>

                    <button id="send" title="Senden">
                        ↑
                    </button>

                </div>

                <div id="hint">
                    LUMORA läuft über deinen lokalen Server.
                </div>

            </div>

        </section>

    </main>

</div>

<script>

"use strict";

const messages = document.getElementById("messages");
const empty = document.getElementById("empty");
const promptInput = document.getElementById("prompt");
const sendButton = document.getElementById("send");

const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");
const modelStatus = document.getElementById("modelStatus");
const newChat = document.getElementById("newChat");

let history = [];
let generating = false;


// ============================================================
// STATUS
// ============================================================

async function checkServer(){

    try{

        const response = await fetch("/api/status",{
            cache:"no-store"
        });

        if(!response.ok){
            throw new Error("Server offline");
        }

        const data = await response.json();

        statusDot.className = "online";
        statusText.textContent = "Online";

        if(data.modelExists){

            modelStatus.textContent =
                "Modell: bereit";

        }else{

            modelStatus.textContent =
                "Modell: noch nicht trainiert";

        }

    }catch(error){

        statusDot.className = "error";
        statusText.textContent = "Offline";

        modelStatus.textContent =
            "Server nicht erreichbar";

    }

}


// ============================================================
// MESSAGE
// ============================================================

function addMessage(role,text){

    empty.style.display = "none";

    const message = document.createElement("div");

    message.className =
        "message " +
        (role === "user"
            ? "user"
            : "assistant");

    const avatar = document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
        role === "user"
            ? "DU"
            : "L";

    const content = document.createElement("div");

    content.className = "content";

    content.textContent = text;

    message.appendChild(avatar);
    message.appendChild(content);

    messages.appendChild(message);

    messages.scrollTop =
        messages.scrollHeight;

    return {
        message,
        content
    };
}


// ============================================================
// TYPING
// ============================================================

function addTyping(){

    empty.style.display = "none";

    const message = document.createElement("div");

    message.className =
        "message assistant";

    const avatar = document.createElement("div");

    avatar.className = "avatar";
    avatar.textContent = "L";

    const content = document.createElement("div");

    content.className =
        "content typing";

    content.innerHTML =
        'LUMORA denkt <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>';

    message.appendChild(avatar);
    message.appendChild(content);

    messages.appendChild(message);

    messages.scrollTop =
        messages.scrollHeight;

    return {
        message,
        content
    };
}


// ============================================================
// GENERATE
// ============================================================

async function generate(){

    if(generating) return;

    const text =
        promptInput.value.trim();

    if(!text) return;

    generating = true;

    sendButton.disabled = true;
    promptInput.disabled = true;

    addMessage("user",text);

    history.push({
        role:"user",
        content:text
    });

    promptInput.value = "";

    const typing = addTyping();

    try{

        const response = await fetch(
            "/api/generate",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({

                    prompt:text,

                    history:history.slice(
                        -20
                    ),

                    systemPrompt:
                        "Du bist LUMORA, eine lokale KI. Antworte hilfreich, klar und auf Deutsch.",

                    maxTokens:160,

                    temperature:.82,

                    topK:40,

                    topP:.92,

                    repetitionPenalty:1.08

                })
            }
        );

        const data =
            await response.json();

        typing.message.remove();

        if(!response.ok || !data.ok){

            const errorText =
                data.error ||
                "LUMORA konnte keine Antwort erzeugen.";

            addMessage(
                "assistant",
                "Fehler: " + errorText
            );

            return;
        }

        const answer =
            typeof data.answer === "string"
                ? data.answer.trim()
                : "";

        if(!answer){

            addMessage(
                "assistant",
                "LUMORA hat keine Antwort erzeugt."
            );

            return;
        }

        addMessage(
            "assistant",
            answer
        );

        history.push({
            role:"assistant",
            content:answer
        });

    }catch(error){

        typing.message.remove();

        addMessage(
            "assistant",
            "Verbindungsfehler: " +
            error.message
        );

        statusDot.className = "error";
        statusText.textContent = "Fehler";

    }finally{

        generating = false;

        sendButton.disabled = false;
        promptInput.disabled = false;

        promptInput.focus();

        checkServer();
    }
}


// ============================================================
// ENTER
// ============================================================

promptInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            generate();
        }

    }
);


// ============================================================
// BUTTON
// ============================================================

sendButton.addEventListener(
    "click",
    generate
);


// ============================================================
// NEW CHAT
// ============================================================

newChat.addEventListener(
    "click",
    () => {

        history = [];

        messages.innerHTML = "";

        messages.appendChild(empty);

        empty.style.display = "block";

        promptInput.value = "";

        promptInput.focus();
    }
);


// ============================================================
// AUTO RESIZE
// ============================================================

promptInput.addEventListener(
    "input",
    () => {

        promptInput.style.height =
            "auto";

        promptInput.style.height =
            Math.min(
                promptInput.scrollHeight,
                180
            ) + "px";

    }
);


// ============================================================
// START
// ============================================================

checkServer();

setInterval(
    checkServer,
    5000
);

promptInput.focus();

</script>

</body>
</html>
